name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The tests run the real meta-notes CLI (stdlib-only Python).
      - uses: actions/checkout@v4
        with:
          repository: jonathanbranam/meta-notes
          path: meta-notes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: echo "$GITHUB_WORKSPACE/meta-notes/bin" >> $GITHUB_PATH
      - run: npm ci && npm run check
